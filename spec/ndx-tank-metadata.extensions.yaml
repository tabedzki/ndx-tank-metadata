    quantity: '?'
  - name: iLaserOn
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Laser command onset frame: the iteration of the command transition, not
      delivered light; 0 if none. Unit: iterations.'
    quantity: '?'
  - name: iMemEntry
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'iteration # when subject entered memory region. Unit: iterations.'
    quantity: '?'
  - name: iOutcome
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Iteration of outcome onset. Unit: iterations.'
    quantity: '?'
  - name: iStartEntry
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'iteration when trial started / subject entered start region. Unit: iterations.'
    quantity: '?'
  - name: iTurnEntry
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'iteration # when subject entered turn region. Unit: iterations.'
    quantity: '?'
  - name: iterations
    neurodata_type_inc: VectorData
    dtype: int32
    doc: '# of iterations (frames) for entire trial. Unit: iterations.'
    quantity: '?'
  - name: landmarkOnset
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Iterations of landmark onset: one vector per landmark type (doorstop task).
      Unit: iterations.'
    quantity: '?'
  - name: landmarkOnset_index
    neurodata_type_inc: VectorIndex
    doc: Index into landmarkOnset, which has a variable number of values per row.
    quantity: '?'
  - name: landmarkOnset_index_index
    neurodata_type_inc: VectorIndex
    doc: Index into landmarkOnset_index, which has a variable number of values per
      row.
    quantity: '?'
  - name: licks_iteration
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Licks in the trial: the iteration of each lick, and its lick port or count
      value.'
    quantity: '?'
  - name: licks_iteration_index
    neurodata_type_inc: VectorIndex
    doc: Index into licks_iteration, which has a variable number of values per row.
    quantity: '?'
  - name: licks_value
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Licks in the trial: the iteration of each lick, and its lick port or count
      value.'
    quantity: '?'
  - name: licks_value_index
    neurodata_type_inc: VectorIndex
    doc: Index into licks_value, which has a variable number of values per row.
    quantity: '?'
  - name: lsrON
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Whether the laser is on for a given trial, 0=laser off, 1=laser on. Codes:
      0=laser off, 1=laser on.'
    quantity: '?'
  - name: modalityRule
    neurodata_type_inc: VectorData
    dtype: int8
    doc: '=1, Tactile Rule; =2, Visual; =0, both modalities rewarded/CS+. Codes: 0=both
      modalities rewarded, 1=tactile rule, 2=visual rule.'
    quantity: '?'
  - name: moonBeaconEnabled
    neurodata_type_inc: VectorData
    dtype: bool
    doc: Boolean, whether the moon beacon is enabled or not.
    quantity: '?'
  - name: moonBeaconPos
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'Scalar [cm], current position of the moon beacon trigger relative to the
      moonBeaconTrigger. Unit: cm.'
    quantity: '?'
  - name: moonBeaconShown
    neurodata_type_inc: VectorData
    dtype: bool
    doc: Whether the moon beacon has been shown in this trial.
    quantity: '?'
  - name: moonBeaconTrigger
    neurodata_type_inc: VectorData
    dtype: text
    doc: "String indicating the trigger point for the moon. Can be 'Sa' or 'Sb'. Codes:
      Sa=first stimulus, Sb=second stimulus."
    quantity: '?'
  - name: moonDistHint
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'Distance from start at which moon beacon appears. Unit: cm.'
    quantity: '?'
  - name: multibiasBeta
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Scalar value indicating the strength of the multibias.
    quantity: '?'
  - name: multibiasTau
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Scalar value indicating the history dependence of the multibias.
    quantity: '?'
  - name: pDistractorTrials
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'proportion of trials including distractor cues (tactile: towers, visual:
      puffs)'
    quantity: '?'
  - name: pairNum
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Integer value indicating which stimulus pair was shown, is a row index into
      stimulusTable.
    quantity: '?'
  - name: probeTrial
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Whether the trial is a probe trial. Codes: 0=regular trial, 1=probe trial.'
    quantity: '?'
  - name: puffOnset_left
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Iterations of air puff onset, on each side. Unit: iterations.'
    quantity: '?'
  - name: puffOnset_left_index
    neurodata_type_inc: VectorIndex
    doc: Index into puffOnset_left, which has a variable number of values per row.
    quantity: '?'
  - name: puffOnset_right
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Iterations of air puff onset, on each side. Unit: iterations.'
    quantity: '?'
  - name: puffOnset_right_index
    neurodata_type_inc: VectorIndex
    doc: Index into puffOnset_right, which has a variable number of values per row.
    quantity: '?'
  - name: puffOpto
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Opto on during puff (tactile) cue region. Codes: 0=off, 1=on.'
    quantity: '?'
  - name: puffPos_left
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'Y positions of the tactile cues (air puffs), on each side. Unit: cm.'
    quantity: '?'
  - name: puffPos_left_index
    neurodata_type_inc: VectorIndex
    doc: Index into puffPos_left, which has a variable number of values per row.
    quantity: '?'
  - name: puffPos_right
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'Y positions of the tactile cues (air puffs), on each side. Unit: cm.'
    quantity: '?'
  - name: puffPos_right_index
    neurodata_type_inc: VectorIndex
    doc: Index into puffPos_right, which has a variable number of values per row.
    quantity: '?'
  - name: rewardBlockIdx
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Index into variable-reward block schedule (varRewardBlocks)
    quantity: '?'
  - name: rewardDelay
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'Time interval between CS+ and reward. Unit: s.'
    quantity: '?'
  - name: rewardFactor
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Reward factor recorded for delivery in the reward state; 0 when no reward
      is due.
    quantity: '?'
  - name: rewardScale
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Multiplier of reward for each correct trial.
    quantity: '?'
  - name: rule
    neurodata_type_inc: VectorData
    dtype: text
    doc: Specifies what the mouse should do to receive reward. Can be "StartCycle
      < EndCycle Left" or "StartCycle < EndCycle Right".
    quantity: '?'
  - name: sideRule
    neurodata_type_inc: VectorData
    dtype: int8
    doc: '=1, Left cue rewarded; =2, Right rewarded; =0, both sides rewarded/CS+.
      Codes: 0=both sides rewarded, 1=left cue rewarded, 2=right cue rewarded.'
    quantity: '?'
  - name: startPosition
    neurodata_type_inc: VectorData
    dtype: float32
    dims:
    - num_rows
    - dim_0
    shape:
    - null
    - 4
    doc: Start position of the trial as [x, y, z, theta].
    quantity: '?'
  - name: step_size
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'Scalar [cm], how much to move the moon beacon triggerpoint on each trial.
      Unit: cm.'
    quantity: '?'
  - name: Hits
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Cumulative hit rate of each stimulus pair at this trial; NaN before a pair
      has been shown.
    quantity: '?'
  - name: Hits_index
    neurodata_type_inc: VectorIndex
    doc: Index into Hits, which has a variable number of values per row.
    quantity: '?'
  - name: NTotal
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Number of times each pair has been shown at this trial.
    quantity: '?'
  - name: NTotal_index
    neurodata_type_inc: VectorIndex
    doc: Index into NTotal, which has a variable number of values per row.
    quantity: '?'
  - name: PostProb
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Posterior probability of showing each pair at this trial.
    quantity: '?'
  - name: PostProb_index
    neurodata_type_inc: VectorIndex
    doc: Index into PostProb, which has a variable number of values per row.
    quantity: '?'
  - name: tactileRule
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Whether tactile cues are rewarding. Codes: 0=tactile cues not rewarding,
      1=tactile cues rewarding.'
    quantity: '?'
  - name: towerOpto
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Opto on during tower (visual) cue region. Codes: 0=off, 1=on.'
    quantity: '?'
  - name: trialDifficultyType
    neurodata_type_inc: VectorData
    dtype: text
    doc: Difficulty category of trial.
    quantity: '?'
  - name: trialID
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Index of the stimulus train drawn from the stimulus bank.
    quantity: '?'
  - name: trialProb
    neurodata_type_inc: VectorData
    dtype: float32
    dims:
    - num_rows
    - dim_0
    shape:
    - null
    - 2
    doc: Probability that the trial was drawn as [left, right], from the trial-drawing
      method.
    quantity: '?'
  - name: trialType
    neurodata_type_inc: VectorData
    dtype: text
    doc: 'Rewarded side of the trial. Codes: L=left, R=right.'
    quantity: '?'
  - name: viStart
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Global ViRMEn iteration count (vr.iterations) at trial start. Unit: iterations.'
    quantity: '?'
  - name: visualRule
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Whether visual cues are rewarding. Codes: 0=visual cues not rewarding, 1=visual
      cues rewarding.'
    quantity: '?'
  - name: wallGuide
    neurodata_type_inc: VectorData
    dtype: bool
    doc: Boolean, whether wallGuides were active or not on this trial.
    quantity: '?'
- neurodata_type_def: VirmenEpochs
  neurodata_type_inc: TimeIntervals
  doc: ViRMEn blocks, one row per block
  datasets:
  - name: P_on
    neurodata_type_inc: VectorData
    dtype: float64
    doc: probability of a trial being a laser on trial.
    quantity: '?'
  - name: context
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Pro/anti context of the block. Codes: 1=Pro, 2=Anti, 3=probe maze.'
    quantity: '?'
  - name: delayDuration
    neurodata_type_inc: VectorData
    dtype: float64
    doc: 'Delay duration. Unit: s.'
    quantity: '?'
  - name: doorstopStatus
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Doorstop condition of the block. Codes: 0=no doorstop, 1=visible doorstop,
      2=invisible doorstop.'
    quantity: '?'
  - name: doorstopVelThresh1
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Delay period entry velocity threshold.
    quantity: '?'
  - name: doorstopVelThresh2
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Delay period entry velocity threshold.
    quantity: '?'
  - name: duration
    neurodata_type_inc: VectorData
    dtype: float64
    doc: 'Duration of the block. Unit: s.'
    quantity: '?'
  - name: easyBlockFlag
    neurodata_type_inc: VectorData
    dtype: bool
    doc: 1 if block was flagged as easy (maze_id < main_maze_id)
    quantity: '?'
  - name: firstTrial
    neurodata_type_inc: VectorData
    dtype: int32
    doc: First trial run in block.
    quantity: '?'
  - name: frozenStimuli
    neurodata_type_inc: VectorData
    dtype: bool
    doc: True if a custom (frozen) stimulus bank is used.
    quantity: '?'
  - name: isLinear
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Enforce linear task or alternation. Codes: 0=alternation, 1=linear.'
    quantity: '?'
  - name: lsrepoch
    neurodata_type_inc: VectorData
    dtype: text
    doc: which task epochs the laser can be on in.
    quantity: '?'
  - name: mainMazeID
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Number of maze of "highest" level for subject.
    quantity: '?'
  - name: mazeID
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Number of maze run in block.
    quantity: '?'
  - name: rewardMiL
    neurodata_type_inc: VectorData
    dtype: float64
    doc: 'Reward delivered during the block. Unit: mL.'
    quantity: '?'
  - name: shapingProtocol
    neurodata_type_inc: VectorData
    dtype: text
    doc: Shaping protocol function handle.
    quantity: '?'
  - name: stage
    neurodata_type_inc: VectorData
    dtype: int32
    doc: variable tracking pro/anti training stage, since mazeID is used to handle
      context switching.
    quantity: '?'
  - name: wall_clock_start
    neurodata_type_inc: VectorData
    dtype: float64
    doc: "Wall-clock time ViRMEn stamped on this block, in seconds since session_start_time.
      The block's start_time is on the session clock and can differ from this stamp:
      a block stamped during setup predates the elapsed clock. Unit: s."
    quantity: '?'
  - name: stimulusBank
    neurodata_type_inc: VectorData
    dtype: text
    doc: Path to stimulus bank file used.
    quantity: '?'
  - name: stimulusConfig
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Index of stimulus configuration in the PoissonStimulusTrain bank.
    quantity: '?'
  - name: stimulusSet
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Stimulus set index.
    quantity: '?'
  - name: sublevel
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Sub-level within maze (LSTT gradual param change)
    quantity: '?'
  - name: trialParams_cueMaxProbability
    neurodata_type_inc: VectorData
    dtype: float64
    doc: max ratio of salient vs. distractor towers.
    quantity: '?'
  - name: trialParams_cueMinProbability
    neurodata_type_inc: VectorData
    dtype: float64
    doc: min ratio of salient vs. distractor towers.
    quantity: '?'
  - name: trialParams_difficultySet
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Percent of easy, medium and hard trials, such as [50, 50, 0]. A single value
      means the mix wasn't used; those logs store false, kept as 0.
    quantity: '?'
  - name: trialParams_difficultySet_index
    neurodata_type_inc: VectorIndex
    doc: Index into trialParams_difficultySet, which has a variable number of values
      per row.
    quantity: '?'
  - name: trialParams_lCue
    neurodata_type_inc: VectorData
    dtype: float64
    doc: 'Length of the cue segment. Unit: cm.'
    quantity: '?'
  - name: trialParams_lMemory
    neurodata_type_inc: VectorData
    dtype: float64
    doc: 'Length of the segment after the cue segment, where no cues appear. Unit:
      cm.'
    quantity: '?'
- neurodata_type_def: StimulusPairs
  neurodata_type_inc: DynamicTable
  doc: 'Stimulus pairs (PWM task), one row per (block, pair): the pair set can change
    between blocks'
  datasets:
  - name: block
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Block (1-based) in which this set of pairs applied: the pair set can change
      between blocks.'
    quantity: '?'
  - name: PairNum
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Row index of the stimulus pair.
    quantity: '?'
  - name: Prob
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Prior probability of each pair.
    quantity: '?'
  - name: Sa
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Frequency of the first stimulus.
    quantity: '?'
  - name: Sb
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Frequency of the second stimulus.
    quantity: '?'
  - name: Side
    neurodata_type_inc: VectorData
    dtype: text
    doc: 'Correct side for each pair. Codes: L=left, R=right.'
    quantity: '?'
- neurodata_type_def: VirmenSettings
  neurodata_type_inc: DynamicTable
  doc: Key/value table of ViRMEn settings whose meaning is unknown or defined by each
    experiment.
  datasets:
  - name: key
    neurodata_type_inc: VectorData
    dtype: text
    doc: ViRMEn log path of the value, with 1-based indexes for struct arrays.
  - name: value
    neurodata_type_inc: VectorData
    dtype: text
    doc: The recorded value, as text.
  - name: meaning
    neurodata_type_inc: VectorData
    dtype: text
    doc: What the value means, from the field registry.
