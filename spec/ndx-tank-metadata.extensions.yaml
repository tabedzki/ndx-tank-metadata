groups:
- neurodata_type_def: LabMetaDataExtension
  neurodata_type_inc: LabMetaData
  doc: type for storing metadata for Brody and Tank labs
  attributes:
  - name: session_performance
    dtype: float64
    doc: 'Percentage of correct responses, computed by the converter. Unit: %.'
    required: false
  - name: experiment
    dtype: text
    doc: Path of the ViRMEn experiment world file.
    required: false
  - name: protocol_name
    dtype: text
    doc: Name of protocol run.
  - name: stimulus_bank_path
    dtype: text
    doc: Path of the stimulus bank file; left out when the session has none.
    required: false
  - name: stimulusSet
    dtype: int32
    doc: Index of stimulus set within the bank.
    required: false
  - name: virmenSensor
    dtype: text
    doc: 'Rule that maps ball motion to VR motion (MovementSensor enum). Codes: BottomVelocity=bottom
      sensor, velocity, BottomPosition=bottom sensor, position, FrontVelocity=front
      sensor, velocity, ViewAngleLocked=view angle locked.'
    required: false
  - name: consecutiveViolationTrials
    dtype: int32
    doc: Running count of consecutive violation trials (live stats)
    required: false
  - name: initialTimestamp
    dtype: isodatetime
    doc: Clock time when the ViRMEn engine started.
    required: false
  - name: num_trials
    dtype: int32
    doc: Number of trials of session (count of logEnd calls)
  - name: numTrialsTry
    dtype: int32
    dims:
    - dim_0
    shape:
    - null
    doc: Number of trials for each try (restart) of the session.
    required: false
  - name: session_end_time
    dtype: isodatetime
    doc: Datetime when the session ended.
  - name: timeElapsedFirstTrial
    dtype: float64
    doc: 'timeElapsed from ViRMEn engine start to first iteration (t=0 trial) Unit:
      s.'
    required: false
  - name: timeElapsedVideoStart
    dtype: float64
    doc: 'timeElapsed from ViRMEn engine start to video capture start; for syncing
      face video and ViRMEn. Unit: s.'
    required: false
  - name: experiment_name
    dtype: text
    doc: Name of experiment run.
  - name: codeVersion
    dtype: float64
    doc: Code version number from vr.exper.variables.codeVersion (versionInfo)
    required: false
  - name: mazeVersion
    dtype: float64
    doc: Maze version number from vr.exper.variables.mazeVersion (versionInfo)
    required: false
  - name: world_file_name
    dtype: text
    doc: Name of world file run.
  - name: commit_id
    dtype: text
    doc: Commit of the ViRMEn repository during the session; empty in one surveyed
      log.
    required: false
  - name: location
    dtype: text
    doc: Name of the rig where the session ran.
  groups:
  - name: rig
    neurodata_type_inc: RigExtension
    doc: type for storing rig information
  - name: mazes
    neurodata_type_inc: MazeExtension
    doc: type for storing maze information
  - name: animal
    neurodata_type_inc: AnimalSettings
    doc: settings of the animal
    quantity: '?'
  - name: settings
    neurodata_type_inc: VirmenSettings
    doc: other ViRMEn settings
    quantity: '?'
  - name: stimulus_pairs
    neurodata_type_inc: StimulusPairs
    doc: stimulus pairs (PWM task)
    quantity: '?'
- neurodata_type_def: RigExtension
  neurodata_type_inc: LabMetaData
  doc: type for storing rig information
  attributes:
  - name: arduinoPort
    dtype: text
    doc: Arduino port as seen in the Windows Device Manager.
    required: false
  - name: ballCircumference
    dtype: float64
    doc: 'Circumference of the ball. Unit: cm.'
    required: false
  - name: colorAdjustment
    dtype: float64
    dims:
    - dim_0
    shape:
    - 3
    doc: '[R; G; B] scale factor for projector display.'
    required: false
  - name: hasDAQ
    dtype: bool
    doc: Whether the rig has a DAQ; false when testing on a laptop.
    required: false
  - name: hasSyncComm
    dtype: bool
    doc: Whether digital communications are used for synchronization (ScanImage).
    required: false
  - name: laserChannel
    dtype: int32
    doc: NI-DAQ digital line for turning on/off the laser.
    required: false
  - name: leftPuffChannel
    dtype: int32
    doc: NI-DAQ digital line for the left air puff solenoid.
    required: false
  - name: minIterationDT
    dtype: float64
    doc: 'Minimum expected duration of one ViRMEn iteration. Unit: s.'
    required: false
  - name: nidaqDevice
    dtype: int32
    doc: NI-DAQ device identifier.
    required: false
  - name: nidaqLines
    dtype: int32
    dims:
    - dim_0
    shape:
    - null
    doc: NI-DAQ lines for the specified port.
    required: false
  - name: nidaqPort
    dtype: int32
    doc: NI-DAQ port number.
    required: false
  - name: proj_param_Rs
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_hrescaling
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_hshift
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_r
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_vrescaling
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_vshift
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_xOm
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_xP1o
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_xsm
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_yOm
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_yP1o
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_ysm
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_zOm
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_zP1o
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: proj_param_zsm
    dtype: float64
    doc: Mini VR spherical-mirror projection geometry parameter.
    required: false
  - name: puffDuration
    dtype: float64
    doc: Duration of the air puff.
    required: false
  - name: rewardChannel
    dtype: int32
    doc: NI-DAQ digital line for turning on/off the solenoid valve.
    required: false
  - name: rewardDuration
    dtype: float64
    doc: 'Valve opening duration for a 4 uL reward. Unit: s.'
    required: false
  - name: rewardSize
    dtype: float64
    doc: 'Size of one reward. Unit: mL.'
    required: false
  - name: rig_type
    dtype: text
    doc: miniVR or normalVR (the projection depends on the rig type).
    required: false
  - name: rightPuffChannel
    dtype: int32
    doc: NI-DAQ digital line for the right air puff solenoid.
    required: false
  - name: sensorDotsPerRev
    dtype: float64
    dims:
    - dim_0
    shape:
    - null
    doc: Sensor dots per ball revolution, per MovementSensor (calibrateBall)
    required: false
  - name: simulationMode
    dtype: bool
    doc: Whether the session ran in simulation mode, with human input via keyboard.
    required: false
  - name: soundAdjustment
    dtype: float64
    doc: Scale factor for sound volume.
    required: false
  - name: squal
    dtype: float64
    doc: Mean ball-sensor surface quality (squal) measured at session start.
    required: false
  - name: syncClockChannel
    dtype: int32
    doc: NI-DAQ digital line for I2C clock signal.
    required: false
  - name: syncDataChannel
    dtype: int32
    doc: NI-DAQ digital line for I2C data signal.
    required: false
  - name: toroidXFormP1
    dtype: float64
    doc: p1 parameter (slope) from poly1 fit of toroidal screen transformation.
    required: false
  - name: toroidXFormP2
    dtype: float64
    doc: p2 parameter (offset) from poly1 fit of toroidal screen transformation.
    required: false
- neurodata_type_def: AnimalSettings
  neurodata_type_inc: LabMetaData
  doc: settings of the animal from the training GUI
  attributes:
  - name: autoAdvance
    dtype: bool
    doc: Whether the animal is automatically advanced through levels.
    required: false
  - name: behaviorVideo
    dtype: int8
    doc: Index into the training GUI's list of behavior video presets.
    required: false
  - name: mainDrawMethod
    dtype: text
    doc: Method for drawing main trials, for example TRIAL_DRAWING.
    required: false
  - name: mainDrawMethodParameter
    dtype: float64
    doc: Parameter of the method for drawing main trials.
    required: false
  - name: mainMazeID
    dtype: int32
    doc: Current main maze (training level) for the animal.
    required: false
  - name: manipulationType
    dtype: text
    doc: Manipulation type ('none', 'optogenetics', ...)
    required: false
  - name: motionBlurRange
    dtype: float64
    dims:
    - dim_0
    shape:
    - 2
    doc: Motion-blur range applied to cues.
    required: false
  - name: motorBias
    dtype: bool
    doc: Whether motor-bias correction is applied.
    required: false
  - name: pulseDelayStim
    dtype: float64
    dims:
    - dim_0
    shape:
    - 2
    doc: Stimulation pulse as [delay, width].
    required: false
  - name: pupillometryVideo
    dtype: int8
    doc: Index into the training GUI's list of pupillometry video presets.
    required: false
  - name: rewardFactor
    dtype: float64
    dims:
    - dim_0
    - dim_1
    shape:
    - 2
    - null
    doc: Reward multiplier table, with one column per level.
    required: false
  - name: subtask
    dtype: text
    doc: Sub-task label.
    required: false
  - name: virmenDisplacementPerCm
    dtype: float64
    doc: VR displacement gain per cm of ball motion.
    required: false
  - name: virmenRotationsPerRev
    dtype: float64
    doc: View-angle scale factor (NaN default)
    required: false
  - name: warmupDrawMethod
    dtype: text
    doc: Method for drawing warmup trials, for example TRIAL_DRAWING.
    required: false
  - name: warmupDrawMethodParameter
    dtype: float64
    doc: Parameter of the method for drawing warmup trials.
    required: false
  - name: waterAlloc
    dtype: float64
    doc: 'Daily water allocation. Unit: mL.'
    required: false
- neurodata_type_def: MazeExtension
  neurodata_type_inc: DynamicTable
  doc: type for storing maze information, one row per maze
  datasets:
  - name: blockPerform
    neurodata_type_inc: VectorData
    dtype: float64
    doc: performance threshold to go into easy block.
    quantity: '?'
  - name: criteriaNTrials
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Number of trials over which performance criteria are evaluated.
    quantity: '?'
  - name: easyBlock
    neurodata_type_inc: VectorData
    dtype: float64
    doc: maze ID of easy block (NaN = none)
    quantity: '?'
  - name: easyBlock_index
    neurodata_type_inc: VectorIndex
    doc: Index into easyBlock, which has a variable number of values per row.
    quantity: '?'
  - name: easyBlockNTrials
    neurodata_type_inc: VectorData
    dtype: float64
    doc: number of trials in easy block.
    quantity: '?'
  - name: easyBlockPerformanceDemote
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Performance threshold for demotion into easier easy block.
    quantity: '?'
  - name: easyBlockPerformanceDemote_index
    neurodata_type_inc: VectorIndex
    doc: Index into easyBlockPerformanceDemote, which has a variable number of values
      per row.
    quantity: '?'
  - name: easyBlockPerformancePromote
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Performance threshold for promotion back to main maze or more difficult easy
      block.
    quantity: '?'
  - name: easyBlockPerformancePromote_index
    neurodata_type_inc: VectorIndex
    doc: Index into easyBlockPerformancePromote, which has a variable number of values
      per row.
    quantity: '?'
  - name: maxBias
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Maximum side bias permitted to advance.
    quantity: '?'
  - name: numBlockTrials
    neurodata_type_inc: VectorData
    dtype: float64
    doc: number of trials for sliding window performance.
    quantity: '?'
  - name: numRewardsPerMin
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Number of reward required per minute to be considered maintaining “good”
      performance.
    quantity: '?'
  - name: numSessions
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Minimum number of sessions at this level before advancing.
    quantity: '?'
  - name: numTrials
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Minimum number of trials to advance level.
    quantity: '?'
  - name: numTrialsPerMin
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Minimum trials per minute to advance.
    quantity: '?'
  - name: performance
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Performance threshold to advance.
    quantity: '?'
  - name: sublevelDemotion
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Whether the level demotes to a lower sublevel. Codes: 0=no sublevel demotion,
      1=sublevel demotion.'
    quantity: '?'
  - name: warmupBias
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Bias threshold to finish warmup.
    quantity: '?'
  - name: warmupBias_index
    neurodata_type_inc: VectorIndex
    doc: Index into warmupBias, which has a variable number of values per row.
    quantity: '?'
  - name: warmupMaze
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Maze ID(s) used for warmup.
    quantity: '?'
  - name: warmupMaze_index
    neurodata_type_inc: VectorIndex
    doc: Index into warmupMaze, which has a variable number of values per row.
    quantity: '?'
  - name: warmupMotor
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Motor (excess travel) threshold for warmup.
    quantity: '?'
  - name: warmupMotor_index
    neurodata_type_inc: VectorIndex
    doc: Index into warmupMotor, which has a variable number of values per row.
    quantity: '?'
  - name: warmupNTrials
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Number of warmup trials (per warmup maze); [] if none, vector if several
      warmups.
    quantity: '?'
  - name: warmupNTrials_index
    neurodata_type_inc: VectorIndex
    doc: Index into warmupNTrials, which has a variable number of values per row.
    quantity: '?'
  - name: warmupPerform
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Performance threshold to finish warmup.
    quantity: '?'
  - name: warmupPerform_index
    neurodata_type_inc: VectorIndex
    doc: Index into warmupPerform, which has a variable number of values per row.
    quantity: '?'
  - name: turnHint_Mem
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Whether the turn hint is visible in the memory region for this level. Codes:
      -1=not specified, 0=hidden, 1=visible.'
    quantity: '?'
  - name: turnHint_Puff
    neurodata_type_inc: VectorData
    dtype: bool
    doc: Whether the turn hint is visible in the puff region for this level.
    quantity: '?'
  - name: lCue
    neurodata_type_inc: VectorData
    dtype: float64
    doc: 'Length of the cue segment. Unit: cm.'
    quantity: '?'
  - name: lMemory
    neurodata_type_inc: VectorData
    dtype: float64
    doc: 'Length of the memory (delay) segment. Unit: cm.'
    quantity: '?'
  - name: lStart
    neurodata_type_inc: VectorData
    dtype: float64
    doc: 'Length of the start segment. Unit: cm.'
    quantity: '?'
  - name: tri_turnHint
    neurodata_type_inc: VectorData
    dtype: float64
    doc: 'Turn hint visibility: 0 hidden; 1 visible; above 2, visible until this distance
      from the end of the stem; below 0, hidden until the absolute value of this distance.
      Unit: cm when it is a distance.'
    quantity: '?'
  - name: world
    neurodata_type_inc: VectorData
    dtype: int32
    doc: Index of the ViRMEn world used by this maze level.
    quantity: '?'
- neurodata_type_def: VirmenTrials
  neurodata_type_inc: TimeIntervals
  doc: ViRMEn trials, one row per trial
  datasets:
  - name: stimulus_pair
    neurodata_type_inc: DynamicTableRegion
    doc: Row of StimulusPairs shown on this trial.
    quantity: '?'
  - name: CS_isRewarded
    neurodata_type_inc: VectorData
    dtype: bool
    doc: Whether the conditioned stimulus is rewarded.
    quantity: '?'
  - name: CS_modality
    neurodata_type_inc: VectorData
    dtype: text
    doc: 'Sensory modality of the conditioned stimulus. Codes: visual=visual, tactile=tactile,
      none=no stimulus presented.'
    quantity: '?'
  - name: CS_position
    neurodata_type_inc: VectorData
    dtype: float64
    doc: 'Positions of the conditioned stimulus along the track. Unit: cm.'
    quantity: '?'
  - name: CS_position_index
    neurodata_type_inc: VectorIndex
    doc: Index into CS_position, which has a variable number of values per row.
    quantity: '?'
  - name: CS_presented
    neurodata_type_inc: VectorData
    dtype: bool
    doc: Whether the conditioned stimulus was presented.
    quantity: '?'
  - name: CS_side
    neurodata_type_inc: VectorData
    dtype: text
    doc: 'Side of the conditioned stimulus. Codes: L=left, R=right, none=no stimulus
      presented.'
    quantity: '?'
  - name: EndCycle
    neurodata_type_inc: VectorData
    dtype: int32
    doc: The spatial frequency of the second stimulus shown to the mouse.
    quantity: '?'
  - name: LaserTrialType
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Laser epoch type of the trial. Codes: 0=default, 1=laser during cue, 2=laser
      during outcome.'
    quantity: '?'
  - name: P_clamp
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Probability of a viewangle-clamp trial -- defaults to 20.
    quantity: '?'
  - name: StartCycle
    neurodata_type_inc: VectorData
    dtype: int32
    doc: The spatial frequency of the first stimulus shown to the mouse.
    quantity: '?'
  - name: TTL_stamp
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'TTL times sent during the trial, on the elapsed-time clock. Unit: s.'
    quantity: '?'
  - name: TTL_stamp_index
    neurodata_type_inc: VectorIndex
    doc: Index into TTL_stamp, which has a variable number of values per row.
    quantity: '?'
  - name: alpha_minus
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Scalar, how much to multiply step_size by when moving the moon beacon trigger
      back.
    quantity: '?'
  - name: alpha_plus
    neurodata_type_inc: VectorData
    dtype: float32
    doc: Scalar, how much to multiply step_size by when moving the moon beacon trigger
      forward.
    quantity: '?'
  - name: baseCycles
    neurodata_type_inc: VectorData
    dtype: int32
    doc: The base set of spatial frequencies from which StartCycle and EndCycle can
      be drawn.
    quantity: '?'
  - name: baseCycles_index
    neurodata_type_inc: VectorIndex
    doc: Index into baseCycles, which has a variable number of values per row.
    quantity: '?'
  - name: choice
    neurodata_type_inc: VectorData
    dtype: text
    doc: 'Choice the animal made in the trial. Codes: L=left, R=right, nil=no choice
      (trial violation).'
    quantity: '?'
  - name: counter_licks_iteration
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Lick counter readings: the iteration of each reading, and the new lick count.'
    quantity: '?'
  - name: counter_licks_iteration_index
    neurodata_type_inc: VectorIndex
    doc: Index into counter_licks_iteration, which has a variable number of values
      per row.
    quantity: '?'
  - name: counter_licks_value
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Lick counter readings: the iteration of each reading, and the new lick count.'
    quantity: '?'
  - name: counter_licks_value_index
    neurodata_type_inc: VectorIndex
    doc: Index into counter_licks_value, which has a variable number of values per
      row.
    quantity: '?'
  - name: cueCombo_left
    neurodata_type_inc: VectorData
    dtype: bool
    doc: Whether each cue slot holds a cue on the left and on the right.
    quantity: '?'
  - name: cueCombo_left_index
    neurodata_type_inc: VectorIndex
    doc: Index into cueCombo_left, which has a variable number of values per row.
    quantity: '?'
  - name: cueCombo_right
    neurodata_type_inc: VectorData
    dtype: bool
    doc: Whether each cue slot holds a cue on the left and on the right.
    quantity: '?'
  - name: cueCombo_right_index
    neurodata_type_inc: VectorIndex
    doc: Index into cueCombo_right, which has a variable number of values per row.
    quantity: '?'
  - name: cueOffset_left
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Iteration # when cues disappeared in trial. Unit: iterations.'
    quantity: '?'
  - name: cueOffset_left_index
    neurodata_type_inc: VectorIndex
    doc: Index into cueOffset_left, which has a variable number of values per row.
    quantity: '?'
  - name: cueOffset_right
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Iteration # when cues disappeared in trial. Unit: iterations.'
    quantity: '?'
  - name: cueOffset_right_index
    neurodata_type_inc: VectorIndex
    doc: Index into cueOffset_right, which has a variable number of values per row.
    quantity: '?'
  - name: cueOnset_left
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Iteration # when cues appeared in trial. Unit: iterations.'
    quantity: '?'
  - name: cueOnset_left_index
    neurodata_type_inc: VectorIndex
    doc: Index into cueOnset_left, which has a variable number of values per row.
    quantity: '?'
  - name: cueOnset_right
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Iteration # when cues appeared in trial. Unit: iterations.'
    quantity: '?'
  - name: cueOnset_right_index
    neurodata_type_inc: VectorIndex
    doc: Index into cueOnset_right, which has a variable number of values per row.
    quantity: '?'
  - name: cuePos_left
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'Position in maze for each cue. Unit: cm.'
    quantity: '?'
  - name: cuePos_left_index
    neurodata_type_inc: VectorIndex
    doc: Index into cuePos_left, which has a variable number of values per row.
    quantity: '?'
  - name: cuePos_right
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'Position in maze for each cue. Unit: cm.'
    quantity: '?'
  - name: cuePos_right_index
    neurodata_type_inc: VectorIndex
    doc: Index into cuePos_right, which has a variable number of values per row.
    quantity: '?'
  - name: currentSetpoint
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'Current setpoint of the trial. Unit: A.'
    quantity: '?'
  - name: duration
    neurodata_type_inc: VectorData
    dtype: float32
    doc: 'Duration in seconds of entire trial. Unit: s.'
    quantity: '?'
  - name: excessTravel
    neurodata_type_inc: VectorData
    dtype: float32
    doc: parameter that measures extra distance run by subject.
    quantity: '?'
  - name: finalchoice
    neurodata_type_inc: VectorData
    dtype: text
    doc: 'Final choice in the trial, for example after retries. Codes: L=left, R=right,
      nil=no choice.'
    quantity: '?'
  - name: forcedChoice
    neurodata_type_inc: VectorData
    dtype: int8
    doc: 'Whether a trial is a forced choice L-maze environment, 0=T-maze, 1=L-maze.
      Codes: 0=T-maze, 1=L-maze (forced choice).'
    quantity: '?'
  - name: iArmEntry
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'iteration # when subject entered arm region. Unit: iterations.'
    quantity: '?'
  - name: iBlank
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'iteration # when screen is turned off. Unit: iterations.'
    quantity: '?'
  - name: iChoice
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'iteration of choice onset. Unit: iterations.'
    quantity: '?'
  - name: iChoiceEntry
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'iteration of entry into choice region. Unit: iterations.'
    quantity: '?'
  - name: iCueEntry
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'iteration # when subject entered cue region. Unit: iterations.'
    quantity: '?'
  - name: iLaserOff
    neurodata_type_inc: VectorData
    dtype: int32
    doc: 'Laser command offset frame: the iteration of the command transition, not
