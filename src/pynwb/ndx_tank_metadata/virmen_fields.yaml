# ViRMEn log fields and where they go in NWB. See registry.py; the spec is generated from this file.
fields:
- path: derived.session_performance
  destination: lab_meta_attribute
  name: "session_performance"
  dtype: float64
  shape: []
  unit: "%"
  in_spec: true
  description: "Percentage of correct responses, computed by the converter."
- path: derived.stimulus_pairs.block
  destination: stimulus_pairs_column
  name: "block"
  dtype: int32
  shape: []
  in_spec: true
  description: "Block (1-based) in which this set of pairs applied: the pair set can change between blocks."
- path: derived.trial.stimulus_pair
  destination: trial_column
  name: "stimulus_pair"
  dtype: region
  shape: []
  in_spec: true
  description: "Row of StimulusPairs shown on this trial."
  notes: "Built from pairNum and the trial's block."
- path: log.animal
  destination: structural
  description: "Trainee (animal) struct."
- path: log.animal.Date
  destination: drop
  description: "Date (datevec) associated with trainee record."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.EnableLiveStats
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.Profile
  destination: drop
  description: "Training schedule profile index."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.Time
  destination: drop
  description: "Scheduled training time (hour)"
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.autoAdvance
  destination: animal_attribute
  name: "autoAdvance"
  dtype: bool
  shape: []
  in_spec: true
  description: "Whether the animal is automatically advanced through levels."
- path: log.animal.behaviorVideo
  destination: animal_attribute
  name: "behaviorVideo"
  dtype: int8
  shape: []
  in_spec: true
  description: "Index into the training GUI's list of behavior video presets."
- path: log.animal.color
  destination: drop
  description: "GUI display colour for the animal."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.day
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.db_connected
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.experiment
  destination: lab_meta_attribute
  name: "experiment"
  dtype: text
  shape: []
  in_spec: true
  description: "Path of the ViRMEn experiment world file."
- path: log.animal.imagingTags
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "Empty in every surveyed log."
- path: log.animal.isActive
  destination: drop
  description: "Whether the animal is active in the training roster."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.mainDrawMethod
  destination: structural
  description: "{method, parameter} cell for drawing main trials; its members have their own entries."
- path: log.animal.mainDrawMethod.method
  destination: animal_attribute
  name: "mainDrawMethod"
  dtype: text
  shape: []
  in_spec: true
  description: "Method for drawing main trials, for example TRIAL_DRAWING."
- path: log.animal.mainDrawMethod.parameter
  destination: animal_attribute
  name: "mainDrawMethodParameter"
  dtype: float64
  shape: []
  in_spec: true
  description: "Parameter of the method for drawing main trials."
- path: log.animal.mainMazeID
  destination: animal_attribute
  name: "mainMazeID"
  dtype: int32
  shape: []
  in_spec: true
  description: "Current main maze (training level) for the animal."
- path: log.animal.manipulationType
  destination: animal_attribute
  name: "manipulationType"
  dtype: text
  shape: []
  in_spec: true
  description: "Manipulation type ('none', 'optogenetics', ...)"
- path: log.animal.motionBlurRange
  destination: animal_attribute
  name: "motionBlurRange"
  dtype: float64
  shape: [2]
  transform: empty_to_missing
  in_spec: true
  description: "Motion-blur range applied to cues."
- path: log.animal.motorBias
  destination: animal_attribute
  name: "motorBias"
  dtype: bool
  shape: []
  in_spec: true
  description: "Whether motor-bias correction is applied."
- path: log.animal.name
  destination: subject
  name: "subject_id"
  dtype: text
  shape: []
  description: "Name of subject."
- path: log.animal.newTrainingGUI
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.num_mazes
  destination: settings
  name: "animal.num_mazes"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.overrideMazeID
  destination: settings
  name: "animal.overrideMazeID"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.overrideSubMazeID
  destination: settings
  name: "animal.overrideSubMazeID"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.posttraining_instructions
  destination: settings
  name: "animal.posttraining_instructions"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.pretraining_instructions
  destination: settings
  name: "animal.pretraining_instructions"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.protocol
  destination: lab_meta_attribute
  name: "protocol_name"
  dtype: text
  shape: []
  transform: function_name
  required: true
  in_spec: true
  description: "Name of protocol run."
- path: log.animal.pulseDelayStim
  destination: animal_attribute
  name: "pulseDelayStim"
  dtype: float64
  shape: [2]
  transform: pad_pair
  in_spec: true
  description: "Stimulation pulse as [delay, width]."
  notes: "Two logs hold only the delay as a scalar, stored as [delay, NaN]."
- path: log.animal.pupillometryVideo
  destination: animal_attribute
  name: "pupillometryVideo"
  dtype: int8
  shape: []
  in_spec: true
  description: "Index into the training GUI's list of pupillometry video presets."
  notes: "source: TrainingRegiment.m:2329 (pupillometry_video_list)."
- path: log.animal.pupillometry_video_acq_struct
  destination: structural
  description: "Pupillometry video acquisition settings."
- path: log.animal.pupillometry_video_acq_struct.local_video_name
  destination: settings
  name: "animal.pupillometry_video_acq_struct.local_video_name"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.pupillometry_video_acq_struct.remote_video_name
  destination: settings
  name: "animal.pupillometry_video_acq_struct.remote_video_name"
  dtype: text
