- path: log.animal.stimulationProtocol.stim_frequency
  destination: settings
  name: "animal.stimulationProtocol.stim_frequency"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.stimulationProtocol.stim_parameter_description
  destination: settings
  name: "animal.stimulationProtocol.stim_parameter_description"
  dtype: text
  shape: []
