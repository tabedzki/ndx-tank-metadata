- path: log.animal.stimulationProtocol.optogenetic_protocol_id
  destination: settings
  name: "animal.stimulationProtocol.optogenetic_protocol_id"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.stimulationProtocol.protocol_description
  destination: settings
  name: "animal.stimulationProtocol.protocol_description"
  dtype: text
