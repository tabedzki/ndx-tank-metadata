- path: log.animal.user_id
  destination: settings
  name: "animal.user_id"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.virmenDisplacementPerCm
  destination: animal_attribute
  name: "virmenDisplacementPerCm"
  dtype: float64
  shape: []
  in_spec: true
  description: "VR displacement gain per cm of ball motion."
- path: log.animal.virmenRotationsPerRev
  destination: animal_attribute
  name: "virmenRotationsPerRev"
  dtype: float64
  shape: []
  in_spec: true
  description: "View-angle scale factor (NaN default)"
- path: log.animal.virmenSensor
  destination: lab_meta_attribute
  name: "virmenSensor"
  dtype: text
  shape: []
  transform: enum_name
  in_spec: true
  description: "Rule that maps ball motion to VR motion (MovementSensor enum)."
  codes:
    "BottomVelocity": "bottom sensor, velocity"
    "BottomPosition": "bottom sensor, position"
    "FrontVelocity": "front sensor, velocity"
    "ViewAngleLocked": "view angle locked"
- path: log.animal.warmupDrawMethod
  destination: structural
  description: "{method, parameter} cell for drawing warmup trials; its members have their own entries."
- path: log.animal.warmupDrawMethod.method
  destination: animal_attribute
  name: "warmupDrawMethod"
  dtype: text
  shape: []
  in_spec: true
  description: "Method for drawing warmup trials, for example TRIAL_DRAWING."
- path: log.animal.warmupDrawMethod.parameter
  destination: animal_attribute
  name: "warmupDrawMethodParameter"
  dtype: float64
  shape: []
  in_spec: true
  description: "Parameter of the method for drawing warmup trials."
- path: log.animal.waterAlloc
  destination: animal_attribute
  name: "waterAlloc"
  dtype: float64
  shape: []
  unit: "mL"
  in_spec: true
  description: "Daily water allocation."
- path: log.animal.writeSession
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.block
  destination: structural
  description: "Blocks of trials with a common maze configuration."
- path: log.block.P_on
  destination: epoch_column
  name: "P_on"
  dtype: float64
  shape: []
  in_spec: true
  description: "probability of a trial being a laser on trial."
- path: log.block.context
  destination: epoch_column
  name: "context"
  dtype: int8
  shape: []
  in_spec: true
  description: "Pro/anti context of the block."
  codes:
    1: "Pro"
    2: "Anti"
    3: "probe maze"
  notes: "The field sheet lists 1 and 2; the Pro/Anti experiment code also sets 3 on probe trials."
- path: log.block.delayDuration
  destination: epoch_column
  name: "delayDuration"
  dtype: float64
  shape: []
  unit: "s"
  in_spec: true
  description: "Delay duration."
- path: log.block.doorstopStatus
  destination: epoch_column
  name: "doorstopStatus"
  dtype: int8
  shape: []
  in_spec: true
  description: "Doorstop condition of the block."
  codes:
    0: "no doorstop"
    1: "visible doorstop"
    2: "invisible doorstop"
- path: log.block.doorstopVelThresh1
  destination: epoch_column
  name: "doorstopVelThresh1"
  dtype: float64
  shape: []
  in_spec: true
  description: "Delay period entry velocity threshold."
- path: log.block.doorstopVelThresh2
  destination: epoch_column
  name: "doorstopVelThresh2"
  dtype: float64
  shape: []
  in_spec: true
  description: "Delay period entry velocity threshold."
- path: log.block.duration
  destination: epoch_column
  name: "duration"
  dtype: float64
  shape: []
  unit: "s"
  in_spec: true
  description: "Duration of the block."
- path: log.block.easyBlockFlag
  destination: epoch_column
  name: "easyBlockFlag"
  dtype: bool
  shape: []
  in_spec: true
  description: "1 if block was flagged as easy (maze_id < main_maze_id)"
- path: log.block.firstTrial
  destination: epoch_column
  name: "firstTrial"
  dtype: int32
  shape: []
  in_spec: true
  description: "First trial run in block."
- path: log.block.frozenStimuli
  destination: epoch_column
  name: "frozenStimuli"
  dtype: bool
  shape: []
  in_spec: true
  description: "True if a custom (frozen) stimulus bank is used."
- path: log.block.isLinear
  destination: epoch_column
  name: "isLinear"
  dtype: int8
  shape: []
  in_spec: true
  description: "Enforce linear task or alternation."
  codes:
    0: "alternation"
    1: "linear"
- path: log.block.iterStr
  destination: drop
  description: "Integer class used to store iteration indices (e.g. 'uint16')"
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.block.lsrepoch
  destination: epoch_column
  name: "lsrepoch"
  dtype: text
  shape: []
  in_spec: true
  description: "which task epochs the laser can be on in."
- path: log.block.mainMazeID
  destination: epoch_column
  name: "mainMazeID"
  dtype: int32
  shape: []
  in_spec: true
  description: "Number of maze of \"highest\" level for subject."
- path: log.block.mazeID
  destination: epoch_column
  name: "mazeID"
  dtype: int32
  shape: []
  in_spec: true
  description: "Number of maze run in block."
- path: log.block.motionBlurRange
  destination: drop
  description: "Motion blur range in effect."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.block.rewardMiL
  destination: epoch_column
  name: "rewardMiL"
  dtype: float64
  shape: []
  unit: "mL"
  in_spec: true
  description: "Reward delivered during the block."
- path: log.block.shapingProtocol
  destination: epoch_column
  name: "shapingProtocol"
  dtype: text
  shape: []
  transform: function_name
  in_spec: true
  description: "Shaping protocol function handle."
- path: log.block.stage
  destination: epoch_column
  name: "stage"
  dtype: int32
  shape: []
  in_spec: true
  description: "variable tracking pro/anti training stage, since mazeID is used to handle context switching."
- path: log.block.start
  destination: epoch_column
  name: "wall_clock_start"
  dtype: float64
  shape: []
  unit: "s"
  transform: seconds_from_session_start
  in_spec: true
  description: "Wall-clock time ViRMEn stamped on this block, in seconds since session_start_time. The block's start_time is on the session clock and can differ from this stamp: a block stamped during setup predates the elapsed clock."
  notes: "start_time and stop_time come from the elapsed clock through derived.clock_offset; see the clock_anchor settings row."
- path: log.block.stimRegime
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "Empty in every surveyed log."
- path: log.block.stimType
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "Empty in every surveyed log."
- path: log.block.stimulusBank
  destination: epoch_column
  name: "stimulusBank"
  dtype: text
  shape: []
  in_spec: true
  description: "Path to stimulus bank file used."
- path: log.block.stimulusCommit
  destination: drop
  description: "Commit/ID of stimulus bank (0 if generated)"
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.block.stimulusConfig
  destination: epoch_column
  name: "stimulusConfig"
  dtype: int32
  shape: []
  in_spec: true
  description: "Index of stimulus configuration in the PoissonStimulusTrain bank."
- path: log.block.stimulusSet
  destination: epoch_column
  name: "stimulusSet"
  dtype: int32
  shape: []
  in_spec: true
  description: "Stimulus set index."
- path: log.block.sublevel
  destination: epoch_column
  name: "sublevel"
  dtype: int32
  shape: []
  in_spec: true
  description: "Sub-level within maze (LSTT gradual param change)"
- path: log.block.trial
  destination: structural
  description: "Per-trial records of the block."
- path: log.block.trial.CS
  destination: structural
  description: "Conditioned stimulus of the trial (ConditionedStimulus object); its properties have their own entries."
- path: log.block.trial.CS.isRewarded
  destination: trial_column
  name: "CS_isRewarded"
  dtype: bool
  shape: []
  in_spec: true
  description: "Whether the conditioned stimulus is rewarded."
- path: log.block.trial.CS.modality
  destination: trial_column
  name: "CS_modality"
  dtype: text
  shape: []
  in_spec: true
  description: "Sensory modality of the conditioned stimulus."
  codes:
    "visual": "visual"
    "tactile": "tactile"
    "none": "no stimulus presented"
- path: log.block.trial.CS.position
  destination: trial_column
  name: "CS_position"
  dtype: float64
  shape: [null]
  unit: "cm"
  in_spec: true
  description: "Positions of the conditioned stimulus along the track."
- path: log.block.trial.CS.presented
  destination: trial_column
  name: "CS_presented"
  dtype: bool
  shape: []
  in_spec: true
  description: "Whether the conditioned stimulus was presented."
- path: log.block.trial.CS.side
  destination: trial_column
  name: "CS_side"
  dtype: text
  shape: []
  in_spec: true
  description: "Side of the conditioned stimulus."
  codes:
    "L": "left"
    "R": "right"
    "none": "no stimulus presented"
- path: log.block.trial.EndCycle
  destination: trial_column
  name: "EndCycle"
