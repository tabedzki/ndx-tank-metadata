  name: "animal.pupillometry_video_acq_struct.video_acquisition_rate"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.pupillometry_video_acq_struct.video_ext
  destination: settings
  name: "animal.pupillometry_video_acq_struct.video_ext"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.pupillometry_video_acq_struct.video_gain
  destination: settings
  name: "animal.pupillometry_video_acq_struct.video_gain"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.pupillometry_video_acq_struct.video_parent_path
  destination: settings
  name: "animal.pupillometry_video_acq_struct.video_parent_path"
  dtype: text
  shape: []
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
- path: log.animal.refImageFiles
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "Empty in every surveyed log."
- path: log.animal.restart_session_paradigm
  destination: drop
  description: "How a restarted session is handled ('APPEND SESSION' / 'START NEW SESSION')"
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.rewardFactor
  destination: animal_attribute
  name: "rewardFactor"
  dtype: float64
  shape: [2, null]
  in_spec: true
  description: "Reward multiplier table, with one column per level."
- path: log.animal.sessionIndex
  destination: drop
  description: "Index of session to log to."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.session_struct
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.session_struct.session_date
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.session_struct.session_number
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.session_struct.subject_fullname
  destination: drop
  meaning_known: false
  description: "Meaning not documented yet; stored as recorded."
  notes: "GUI, roster, debug or in-progress state, not part of the session record (issue #3)."
- path: log.animal.softwareParams
  destination: structural
  description: "Software parameter set: a struct when one is set. '' and the GUI default 1 both mean none is set (TrainingRegiment.m:2408)."
- path: log.animal.softwareParams.software_parameter_description
  destination: settings
  name: "animal.softwareParams.software_parameter_description"
  dtype: text
