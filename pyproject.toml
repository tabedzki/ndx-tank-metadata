[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ndx-tank-metadata"
dynamic = ["version"]
description = "NWB:N extension for storing metadata for Tank lab"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Szonja Weigl"},
    { name = "Luiz Tauffer" },
    { name = "Ben Dichter", email = "ben.dichter@gmail.com"  },
    { name = "Christian Tabedzki", email = "ct5868@princeton.edu"  },
]
dependencies = [
    "pynwb>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/catalystneuro/ndx-tank-metadata"

[tool.hatch.version]
path = "src/spec/create_extension_spec.py"

[tool.hatch.build.targets.wheel]
packages = [
    "src/pynwb/ndx_tank_metadata",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/pynwb",
    "/spec/*.yaml",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
module = "hatch_build"
