[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ndx-tank-metadata"
dynamic = ["version"]
description = "NWB:N extension for storing metadata for Tank lab"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Szonja Weigl"},
    { name = "Luiz Tauffer" },
    { name = "Ben Dichter", email = "ben.dichter@gmail.com"  },
    { name = "Christian Tabedzki", email = "ct5868@princeton.edu"  },
]
dependencies = [
    "pynwb>=3.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]

requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/catalystneuro/ndx-tank-metadata"

[tool.hatch.version]
path = "src/spec/create_extension_spec.py"

[tool.hatch.build.targets.wheel]
packages = [
    "src/pynwb/ndx_tank_metadata",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/pynwb",
    "/spec/*.yaml",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.envs.default]
installer = "uv"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
module = "hatch_build"
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "no_db: mark test as not requiring database connection (run without DataJoint DB)",
    "with_db: mark test as requiring database connection (requires active DataJoint connection)",
]